<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv='cache-control' content='no-cache'> 
	<meta http-equiv='expires' content='0'> 
	<meta http-equiv='pragma' content='no-cache'>
    <title>Jorge Salazar</title>
    <link href="/style/style.css" rel="stylesheet" media="all">
	<link href="/lightbox/css/lightbox.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="/images/icon.jpg">
  </head>
  <body>
	<br>
	<button onclick="toggle(this)" value="OFF">Toggle light mode</button>
		
	<div class="background" role="content">
		<div class="row">
			<iframe frameborder="0" src="https://itch.io/embed/4050850?linkback=true&amp;bg_color=222222&amp;fg_color=eeeeee&amp;border_color=363636" width="552" height="167"><a href="https://ululation.itch.io/caries">Caries by Ululation</a></iframe>
		</div>
		<div class="row" style="margin-right: 0px; margin-left: 0px;">
			<iframe src="design/caries_walkthrough.pdf" width="150%" height="800px"></iframe>
		</div>
  	</div>
    <div class="background">
	<nav>
      <a href="/index.html" style="margin: auto;">Back</a>
	</nav>
    </div>
    <script>
  	  const root = document.querySelector(':root');
  	  const setVariables = vars => Object.entries(vars).forEach(v => root.style.setProperty(v[0], v[1]));
  	  let myVariables;
  	  function darkmode() {
  		  let myVariables = {
  			  "--colort1_new": "#6d77a5",
  			  "--colorbg": "#979cb4",
  			  "--colort1": "#383f60",
  			  "--colort2": "#cacfe2",
  			  "--colort3": "#1c1f2c",
  		  };
  		  setVariables(myVariables);
  	  } 
  	  function lightmode() {
  		  let myVariables = {
  	  			  "--colort1_new": "#cacfe2",
  	  			  "--colorbg": "#979cb4",
  	  			  "--colort1": "#587e9e",
  	  			  "--colort2": "#1c1f2c",
  	  			  "--colort3": "#cacfe2",
  	  		  };
  	  		  setVariables(myVariables);
  	  	  } 
  	  function toggle(b) {
  		  if (b.value == "OFF") {
  			lightmode();
  		    b.value = "ON";
  		  } else {
  			darkmode();
  		    b.value = "OFF";
  		  }
  		}
    </script>
</body>
</html>
